<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>
<title>QuizRagab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: a slim school-branded bar, then one focused "stage" per screen.
   Teacher screens are sized for screen-sharing in an online class; student screens for a phone. */
:root{
  --bg:#F1F4FB; --surface:#FFFFFF; --surface-2:#E8EDF9; --ink:#121A4A; --muted:#5A628C; --line:#D6DCEF;
  --brand:#2433A0; --brand-ink:#FFFFFF; --sun:#FFB21E; --sun-ink:#3A2600;
  --team-a:#2D63E8; --team-b:#EE6A1C; --ok:#178F52; --bad:#D23636;
  --o1:#D9424A; --o2:#2D63E8; --o3:#C98A07; --o4:#178F52; --on-color:#FFFFFF;
  --shadow:0 1px 2px rgba(18,26,74,.06),0 6px 20px rgba(18,26,74,.08);
  --font-display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --font-body:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1030; --surface:#141B44; --surface-2:#1C2556; --ink:#EDF0FF; --muted:#A3ABD6; --line:#2A3466;
  --brand:#8E9BFF; --brand-ink:#0B1030; --sun:#FFC24A; --sun-ink:#2A1B00;
  --team-a:#5C8BFF; --team-b:#FF8B47; --ok:#3CC97E; --bad:#FF6B6B;
  --o1:#C93C44; --o2:#3460D6; --o3:#B07A06; --o4:#1C8A51; --on-color:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1030; --surface:#141B44; --surface-2:#1C2556; --ink:#EDF0FF; --muted:#A3ABD6; --line:#2A3466;
  --brand:#8E9BFF; --brand-ink:#0B1030; --sun:#FFC24A; --sun-ink:#2A1B00;
  --team-a:#5C8BFF; --team-b:#FF8B47; --ok:#3CC97E; --bad:#FF6B6B;
  --o1:#C93C44; --o2:#3460D6; --o3:#B07A06; --o4:#1C8A51; --on-color:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;padding-block:6px 14px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.logo-pill{background:#fff;border-radius:12px;padding:4px 8px;display:flex;align-items:center;box-shadow:var(--shadow)}
.logo-pill img{height:38px;width:auto;display:block}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}
.brand b{font-family:var(--font-display);font-size:1.55rem;font-weight:800;color:var(--brand);letter-spacing:.2px}
.brand small{color:var(--muted);font-size:.85rem}
.me{display:flex;align-items:center;gap:8px}
.me img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--sun)}
.me span{font-size:.85rem;color:var(--muted);line-height:1.2}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;cursor:pointer}
.mode-tag{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--surface-2);color:var(--ink);font-size:1rem;transition:transform .12s ease,filter .12s}
.btn:hover{filter:brightness(1.05)} .btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.big{font-size:1.2rem;padding:16px 28px;border-radius:18px}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700}
.in{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:1.1rem;width:100%}
.in:focus{border-color:var(--brand);outline:none}
.code-in{font-family:var(--font-display);font-size:2rem;letter-spacing:8px;text-align:center;direction:ltr}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--font-display);line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:2.2rem} h2{font-size:1.6rem} h3{font-size:1.2rem}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.spacer{flex:1}

/* home */
.home{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:stretch}
.hero{background:var(--brand);color:var(--brand-ink);border-radius:24px;padding:28px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;min-width:0}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;direction:ltr;text-align:right}
.hero p{margin:0;font-size:1.1rem;opacity:.92;max-width:34ch}
.hero .div-mark{position:absolute;inset-inline-end:22px;top:4px;font-family:var(--font-display);font-size:8rem;line-height:1;opacity:.14;pointer-events:none}
.hero .who{display:flex;align-items:center;gap:12px;margin-top:auto}
.hero .who img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--sun)}
.hero .who b{display:block;font-size:1.1rem}
.choices{display:flex;flex-direction:column;gap:14px;min-width:0}
.choice{color:var(--ink);display:flex;align-items:center;gap:16px;text-align:start;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:18px;cursor:pointer;box-shadow:var(--shadow)}
.choice:hover{border-color:var(--brand)}
.choice .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none;font-size:1.8rem;font-family:var(--font-display);font-weight:800}
.choice b{font-family:var(--font-display);font-size:1.35rem;display:block;color:var(--ink)}
.choice span{color:var(--muted)}

/* dashboard */
.sec-title{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sec-title .n{font-family:var(--font-display);background:var(--sun);color:var(--sun-ink);border-radius:10px;padding:0 10px;font-weight:800}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pick{color:var(--ink);border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:6px;min-width:0}
.pick:hover{border-color:var(--brand)}
.pick[aria-pressed="true"]{border-color:var(--brand);background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--brand)}
.pick .num{font-family:var(--font-display);font-weight:800;color:var(--brand);font-size:1.05rem}
.pick b{font-family:var(--font-display);font-size:1.15rem}
.pick small{color:var(--muted);line-height:1.4}
.pick svg{width:40px;height:40px;color:var(--brand)}
.opts-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--brand)}
.qlist{margin:0;padding-inline-start:24px;display:flex;flex-direction:column;gap:6px}
.qlist li::marker{font-family:var(--font-display);color:var(--brand);font-weight:800}
.qlist .ans{color:var(--ok);font-weight:700}
details.card summary{cursor:pointer;font-weight:800;font-family:var(--font-display);font-size:1.1rem}

/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px}
.bigcode{font-family:var(--font-display);font-size:clamp(3rem,10vw,5.5rem);font-weight:800;letter-spacing:10px;color:var(--brand);direction:ltr;text-align:center;line-height:1}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:12px;padding:8px 10px;direction:ltr;min-width:0}
.linkbox code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem;min-width:0}
#qr{display:grid;place-items:center;min-height:10px}
#qr img,#qr canvas{background:#fff;padding:8px;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:4px 6px 4px 12px;font-weight:700;animation:pop .35s ease}
.chip .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-size:1.05rem}
.chip.t0{box-shadow:inset 0 0 0 2px var(--team-a)} .chip.t1{box-shadow:inset 0 0 0 2px var(--team-b)}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:1rem;padding:0 4px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* game header */
.ghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ghead .ttl{min-width:0;flex:1}
.ghead .ttl b{font-family:var(--font-display);font-size:1.4rem;display:block;line-height:1.2}
.ghead .ttl span{color:var(--muted)}
.clock{font-family:var(--font-display);font-size:1.5rem;font-weight:800;background:var(--surface);border-radius:12px;padding:2px 14px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 12px;font-weight:700;font-size:.9rem;background:var(--surface-2)}

/* question + options */
.qcard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px 18px 16px}
.qmeta{color:var(--muted);font-weight:700;font-size:.9rem;margin-bottom:4px}
.qtext{font-family:var(--font-display);font-size:clamp(1.35rem,3.6vw,2.1rem);font-weight:700;line-height:1.45}
.qtext.long{font-size:clamp(1.1rem,2.6vw,1.5rem)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{position:relative;border:0;border-radius:16px;padding:16px 14px 16px 44px;color:var(--on-color);font-weight:800;font-size:clamp(1.05rem,2.6vw,1.45rem);font-family:var(--font-display);text-align:center;cursor:pointer;min-height:72px;line-height:1.35;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.opt .sh{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);font-size:1.1rem;opacity:.85}
.opt.o0{background:var(--o1)} .opt.o1{background:var(--o2)} .opt.o2{background:var(--o3)} .opt.o3{background:var(--o4)}
.opt.long{font-size:clamp(.95rem,2vw,1.1rem);font-family:var(--font-body)}
.opt.dim{opacity:.35} .opt.right{outline:4px solid var(--ok);outline-offset:2px}
.opt[disabled]{cursor:default}
.feedback{margin-top:12px;border-radius:14px;padding:10px 14px;font-weight:800;font-size:1.1rem;text-align:center}
.feedback.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.feedback.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

/* tug of war */
.tug{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px;overflow:hidden}
.tug-teams{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px}
.tug-team{display:flex;flex-direction:column;gap:2px;min-width:0}
.tug-team b{font-family:var(--font-display);font-size:1.3rem}
.tug-team .sc{font-family:var(--font-display);font-size:2.2rem;font-weight:800;line-height:1}
.tug-team.a{color:var(--team-a);align-items:flex-start} .tug-team.b{color:var(--team-b);align-items:flex-end;text-align:end}
.field{position:relative;height:150px;direction:ltr}
.field .mid{position:absolute;left:50%;top:6px;bottom:6px;border-left:3px dashed var(--line)}
.field .zone{position:absolute;top:10px;bottom:10px;width:3px;background:var(--line)}
.rope-g{position:absolute;inset:0;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.rope{position:absolute;left:25%;right:25%;top:50%;height:10px;margin-top:-5px;border-radius:6px;background:repeating-linear-gradient(115deg,#C99A52 0 8px,#A8783A 8px 14px)}
.knot{position:absolute;left:50%;top:50%;width:18px;height:46px;margin:-23px 0 0 -9px;background:var(--bad);border-radius:4px;box-shadow:0 0 0 3px var(--surface)}
.pullers{position:absolute;top:50%;transform:translateY(-50%);display:flex;gap:4px}
.pullers.a{left:75%;flex-direction:row} .pullers.b{right:75%;flex-direction:row-reverse}
.puller{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;border:3px solid;background:var(--surface)}
.pullers.a .puller{border-color:var(--team-a)} .pullers.b .puller{border-color:var(--team-b)}
.rope-g.jig{animation:jig .35s}
@keyframes jig{50%{filter:brightness(1.15)}}
.mini .field{height:96px} .mini .puller{width:30px;height:30px;font-size:.95rem}

/* race */
.lanes{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px}
.lane{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) 54px;align-items:center;gap:10px}
.lane .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:44px;border-radius:12px;background:repeating-linear-gradient(90deg,var(--surface-2) 0 24px,transparent 24px 30px),var(--surface-2);border-inline-start:6px solid var(--line)}
.track .fin{position:absolute;inset-inline-end:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(0deg,var(--ink) 0 5px,var(--surface) 5px 10px);opacity:.6;border-radius:0 0 0 0}
.car{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:0;font-size:1.8rem;transition:inset-inline-start .6s ease;line-height:1}
.lane .pts{font-family:var(--font-display);font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.lane.me .nm{color:var(--brand)}

/* leaderboard */
.lb{display:flex;flex-direction:column;gap:6px}
.lb-row{display:grid;grid-template-columns:34px 38px minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:8px 12px;box-shadow:var(--shadow)}
.lb-row .rk{font-family:var(--font-display);font-weight:800;font-size:1.2rem;text-align:center}
.lb-row .av{font-size:1.5rem;text-align:center}
.lb-row .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .meter{height:6px;border-radius:4px;background:var(--surface-2);margin-top:4px;overflow:hidden}
.lb-row .meter i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .5s}
.lb-row .sc{font-family:var(--font-display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.lb-row.done .nm::after{content:" ✓";color:var(--ok)}

/* quiz teacher */
.quiz-t{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
.timer{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:2.1rem;font-weight:800;background:conic-gradient(var(--sun) var(--p,100%),var(--surface-2) 0)}
.timer span{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.dist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.dist .d{display:grid;grid-template-columns:28px minmax(0,1fr) 40px;align-items:center;gap:8px}
.dist .d i{display:block;height:22px;border-radius:6px}
.answered{font-family:var(--font-display);font-size:1.3rem;font-weight:800}

/* balloons */
.sky{position:relative;height:380px;border-radius:22px;overflow:hidden;background:linear-gradient(to top,var(--surface-2),var(--surface));box-shadow:var(--shadow)}
.balloon{position:absolute;bottom:-150px;width:23%;aspect-ratio:4/5;max-width:130px;border:0;border-radius:50% 50% 46% 46%;color:var(--on-color);font-family:var(--font-display);font-weight:800;font-size:clamp(.95rem,2.6vw,1.25rem);cursor:pointer;display:grid;place-items:center;padding:6px;line-height:1.25;animation:rise var(--dur,9s) linear forwards;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12)}
.balloon::after{content:"";position:absolute;left:50%;bottom:-38px;width:2px;height:36px;background:var(--muted)}
.balloon.b0{background:var(--o1)} .balloon.b1{background:var(--o2)} .balloon.b2{background:var(--o3)} .balloon.b3{background:var(--o4)}
.balloon.popped{animation:popb .3s forwards}
@keyframes rise{to{transform:translateY(-560px)}}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.balloon{animation-duration:calc(var(--dur,9s) * 1.6)}}

/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mcard{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 10px;font-weight:800;font-family:var(--font-display);font-size:clamp(1rem,2.6vw,1.3rem);cursor:pointer;min-height:64px;line-height:1.35;transition:transform .15s,opacity .3s}
.mcard.sel{border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand);transform:scale(1.02)}
.mcard.ans{background:var(--surface-2)}
.mcard.gone{opacity:0;pointer-events:none;transform:scale(.8)}
.mcard.wrong{border-color:var(--bad)}

/* wheel */
.wheel-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.wheel-box{position:relative;width:min(100%,420px);margin-inline:auto;aspect-ratio:1}
.wheel-box canvas{width:100%;height:100%;display:block}
.wheel-box .ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--bad);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.picked{font-family:var(--font-display);font-size:1.8rem;font-weight:800;color:var(--brand)}

/* student */
.st-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.st-top .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:var(--surface);box-shadow:var(--shadow)}
.st-top b{font-family:var(--font-display);font-size:1.15rem}
.wait{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 18px}
.wait .big-av{font-size:4.5rem;line-height:1;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.dots::after{content:"…";animation:dots 1.2s steps(3) infinite}
.team-badge{border-radius:999px;padding:4px 14px;font-weight:800;color:var(--on-color)}
.team-badge.t0{background:var(--team-a)} .team-badge.t1{background:var(--team-b)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:10px 0 18px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(30%,160px)}
.pod .av{font-size:2.6rem}
.pod b{font-weight:800;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pod .blk{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:8px;font-family:var(--font-display);font-size:2rem;font-weight:800;color:var(--on-color)}
.pod.p1 .blk{height:140px;background:var(--sun);color:var(--sun-ink)} .pod.p2 .blk{height:100px;background:var(--o2)} .pod.p3 .blk{height:76px;background:var(--o1)}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:50;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.notice{border-radius:14px;padding:10px 14px;background:color-mix(in srgb,var(--sun) 22%,var(--surface));font-weight:600}
textarea.in{font-size:.9rem;direction:ltr;min-height:120px;font-family:ui-monospace,Consolas,monospace}

@media (max-width:820px){
  .home,.lobby,.quiz-t,.wheel-wrap{grid-template-columns:1fr}
  .hero .div-mark{font-size:6rem}
}
@media (max-width:460px){
  .opts{grid-template-columns:1fr}
  .lane{grid-template-columns:72px minmax(0,1fr) 40px}
  .brand b{font-size:1.3rem} .brand small,.me span,.mode-tag{display:none!important}
  h1{font-size:1.8rem}
}

      return mk(`تقطع سيارة ${v} كيلومتراً كل ساعة. كم ساعة تحتاج لقطع ${D} كيلومتراً؟`, `${h} ساعات`, [`${h+1} ساعات`, `${h*10} ساعة`, `${Math.max(1,h-2)} ساعات`], `${D} كم ÷ ${v}`) }
    const p = ri(r,11,25), n = ri(r,3,9), Tt = p*n;
    return mk(`ثمن القصة ${p} ريالاً. كم قصة يمكن شراؤها بـ ${Tt} ريالاً؟`, `${n} قصص`, [`${n+1} قصص`, `${n*10} قصة`, `${Math.max(2,n-2)} قصص`], `${Tt} ريالاً ÷ ${p}`);
  },
  L6(r){
    const t = ri(r,0,2);
    if(t === 0){ let N, c; do{ N = ri(r,20,70); c = ri(r,3,9) }while(N % c === 0);
      const f = Math.floor(N/c);
      const car = n => cnt(n, 'سيارات', 'سيارة');
      return mk(`${N} طالباً سيركبون سيارات تتسع كل منها لـ ${c} طلاب. كم سيارة يحتاجون على الأقل؟`, car(f+1), [car(f), car(N%c), car(f+2)], `${N} ÷ ${c} (سيارات)`) }
    if(t === 1){ let Tt, p; do{ Tt = ri(r,60,200); p = ri(r,11,30) }while(Tt % p === 0);
      const f = Math.floor(Tt/p);
      const toy = n => cnt(n, 'ألعاب', 'لعبة');
      return mk(`معك ${Tt} ريالاً، وثمن اللعبة ${p} ريالاً. كم لعبة يمكنك شراؤها؟`, toy(f), [toy(f+1), toy(Tt%p), toy(f+2)], `${Tt} ريالاً ÷ ${p} (ألعاب)`) }
    let N, g; do{ N = ri(r,20,70); g = ri(r,3,9) }while(N % g === 0);
    return mk(`وزّع معلم ${N} قلماً بالتساوي على ${g} مجموعات. كم قلماً يتبقى معه؟`, `${N%g}`, [`${Math.floor(N/g)}`, `${(N%g)+1}`, `${g}`], `الباقي من ${N} ÷ ${g}`);
  },
};

const EXPR = /(\d+\s*÷\s*\d+)/;
function matchCard(it){ if(it.m) return { left: it.m, right: it.ma || it.a }; if(it.long) return null; const m = it.q.match(EXPR); return m ? { left: m[1], right: it.a } : null }
function seqItem(L, extra, key, i, matchable = false){
  const base = matchable ? L.items.filter(it => matchCard(it) && (matchCard(it).right.length <= 24)) : L.items;
  if(i < base.length) return base[i];
  if(extra || !base.length) return GEN[L.id](rng(key + ':' + i));
  return base[i % base.length];
}

const plist = s => Object.entries((s && s.players) || {}).map(([id,p]) => ({ id, ...p }));
function ranked(s){
  const ps = plist(s);
  if(s.info.game === 'race') return ps.sort((a,b) => (b.done?1:0)-(a.done?1:0) || (a.finishAt||9e15)-(b.finishAt||9e15) || (b.ok||0)-(a.ok||0));
  return ps.sort((a,b) => (b.score||0)-(a.score||0) || (b.ok||0)-(a.ok||0) || (a.joinedAt||0)-(b.joinedAt||0));
}
function tugState(s){
  const t = [{n:0,ok:0},{n:0,ok:0}];
  plist(s).forEach(p => { const k = p.team ? 1 : 0; t[k].n++; t[k].ok += p.ok || 0 });
  const avg = (t[0].n + t[1].n) / 2 || 1;
  const s0 = t[0].n ? t[0].ok / t[0].n * avg : 0, s1 = t[1].n ? t[1].ok / t[1].n * avg : 0;
  return { t, diff: s0 - s1, target: s.info.set.target || 10 };
}
function raceLen(s){ return s.info.set.raceLen || Math.max(8, Math.min(15, lessonById(s.info.lesson).items.length)) }
function matchTotal(s){ return bookCount(lessonById(s.info.lesson), true) }

function pacedUpdate(s, p, ok, now, frac = 0){
  const g = s.info.game, L = lessonById(s.info.lesson);
  const u = { idx: (p.idx || 0) + 1, t: now };
  if(ok){ u.ok = (p.ok || 0) + 1; u.score = (p.score || 0) + (g === 'balloon' ? 100 + Math.round(60 * frac) : 100) }
  else u.bad = (p.bad || 0) + 1;
  if(g === 'race' && ok && u.ok >= raceLen(s) && !p.done){ u.done = true; u.finishAt = now }
  if(g === 'balloon' && !s.info.set.extra && u.idx >= L.items.length){ u.done = true }
  return u;
}

}

let Store = null;
function b64urlEnc(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'') }
function b64urlDec(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '='; return JSON.parse(decodeURIComponent(escape(atob(s)))) }
function parseCfgText(txt){
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}'); if(a < 0 || b < a) throw new Error('no object');
  let body = txt.slice(a, b+1).replace(/\/\/.*$/gm,'').replace(/([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)\s*:/g, '$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}');
  const c = JSON.parse(body);
  if(!c.projectId && !c.databaseURL) throw new Error('missing');
  if(!c.databaseURL) c.databaseURL = `https://${c.projectId}-default-rtdb.firebaseio.com`;
  return c;
}
function readCfg(){
  try{ const u = new URLSearchParams(location.search).get('fb'); if(u){ const c = b64urlDec(u); lsSet('rc_fb', JSON.stringify(c)); return { cfg:c, src:'link' } } }catch(e){}
  const s = lsGet('rc_fb'); if(s){ try{ return { cfg: JSON.parse(s), src:'saved' } }catch(e){} }
  if(FIREBASE_CONFIG) return { cfg: FIREBASE_CONFIG, src:'code' };
  return null;
}
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s) }) }
async function makeFirebase(cfg){
  const V = '10.12.2';
  if(!window.firebase){
    await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-database-compat.js`);
  }
  const name = 'rc' + hashStr(cfg.databaseURL || cfg.projectId);
  const app = firebase.apps.find(a => a.name === name) || firebase.initializeApp(cfg, name);
  const db = firebase.database(app);
  await Promise.race([db.ref(ROOT).limitToFirst(1).get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 7000))]);
  let off = 0; db.ref('.info/serverTimeOffset').on('value', s => { off = s.val() || 0 });
  const fail = e => { console.error(e); toast('تعذّر الحفظ في قاعدة البيانات. تحقّق من قواعد Firebase.'); throw e };
  return {
    mode:'firebase',
    on(p, cb){ const r = db.ref(p), h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h) },
    set: (p, v) => db.ref(p).set(clean(v)).catch(fail),
    update: (p, o) => db.ref(p).update(clean(o)).catch(fail),
    remove: p => db.ref(p).remove().catch(fail),
    get: async p => (await db.ref(p).get()).val(),
    now: () => Date.now() + off,
  };
}
function makeDemo(){
  const K = 'rc_demo_db'; let tree = {};
  try{ tree = JSON.parse(lsGet(K) || '{}') || {} }catch(e){ tree = {} }
  let bc = null; try{ bc = new BroadcastChannel('rc_demo') }catch(e){}
  const ls = [];
  const keys = p => p.split('/').filter(Boolean);
  const getAt = p => keys(p).reduce((o,k) => o == null ? undefined : o[k], tree);
  function setAt(p, v){ const ks = keys(p); let o = tree; for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]] } const last = ks[ks.length-1]; if(v === null || v === undefined) delete o[last]; else o[last] = clean(v) }
  function notify(){ for(const l of ls.slice()){ const v = getAt(l.p); const s = JSON.stringify(v === undefined ? null : v); if(s !== l.last){ l.last = s; l.cb(JSON.parse(s)) } } }
  function commit(){ lsSet(K, JSON.stringify(tree)); try{ bc && bc.postMessage(JSON.stringify(tree)) }catch(e){} notify() }
  if(bc) bc.onmessage = e => { try{ tree = JSON.parse(e.data) || {} }catch(_){} notify() };
  addEventListener('storage', e => { if(e.key === K){ try{ tree = JSON.parse(e.newValue || '{}') || {} }catch(_){} notify() } });
  return {
    mode:'demo',
    on(p, cb){ const l = { p, cb, last: undefined }; ls.push(l); setTimeout(() => { if(!ls.includes(l)) return; const v = getAt(p); l.last = JSON.stringify(v === undefined ? null : v); cb(JSON.parse(l.last)) }, 0); return () => { const i = ls.indexOf(l); if(i >= 0) ls.splice(i,1) } },
    async set(p, v){ setAt(p, v); commit() },
    async update(p, o){ for(const k in o) setAt(p + '/' + k, o[k]); commit() },
    async remove(p){ setAt(p, null); commit() },
    async get(p){ const v = getAt(p); return v === undefined ? null : clean(v) },
    now: () => Date.now(),
  };
}
async function initStore(){
  const c = readCfg();
  if(c){
    const tries = [c.cfg];
    if(c.src === 'code') DB_URL_FALLBACKS.forEach(u => tries.push({ ...c.cfg, databaseURL: u }));
    let lastErr = null;
    for(const cfg of tries){
      try{ Store = await makeFirebase(cfg); Store.cfgSrc = c.src; Store.cfg = cfg; break }
      catch(e){ console.warn(e); lastErr = e; Store = null; if(/permission/i.test(String(e && (e.code || e.message)))) break }
    }
    if(!Store){ Store = makeDemo(); Store.fbError = true; Store.fbErrMsg = String(lastErr && (lastErr.code || lastErr.message) || '') }
  }
  else Store = makeDemo();
  const tag = $('#modeTag');
  if(Store.mode === 'demo'){ tag.hidden = false; tag.textContent = Store.fbError ? 'تعذّر الاتصال • وضع تجريبي' : 'وضع تجريبي' }
}

function wheelColors(){ const cs = getComputedStyle(document.documentElement); return ['--o1','--o2','--o3','--o4','--team-b','--brand'].map(v => cs.getPropertyValue(v).trim()) }
function drawWheelLoop(id){

}

    if(current.key !== myKey) return;
    lock = false;
    if(local.done){ $('#play').innerHTML = `<div class="card wait"><span class="big-av">🏁</span><h2>${g === 'race' ? 'وصلت إلى خط النهاية!' : 'أنهيت أسئلة الدرس!'}</h2><p class="muted" style="margin:0">انتظر حتى ينهي المعلم اللعبة.</p></div>`; if(g === 'race') confetti(); return }
    const i = local.idx || 0, it = seqItem(L, SS.sess.info.set.extra, SS.pid, i), opts = optionsFor(it, SS.pid + ':' + i);
    const meta = `${it.gen ? 'سؤال إضافي مشابه' : (L.src === 'تأكد' ? 'تأكد' : 'مسائل الدرس') + ' • ' + ar((i % L.items.length) + 1) + ' من ' + ar(L.items.length)}`;
    if(g === 'balloon'){
      const dur = it.long ? 13 : 9;
      $('#play').innerHTML = `<div class="qcard" style="margin-bottom:10px"><div class="qmeta">${meta}</div><div class="qtext ${it.long ? 'long' : ''}">${T(it.q)}</div></div>
        <div class="sky" id="sky">${opts.map((o,k) => `<button class="balloon b${k}" type="button" data-o="${esc(o)}" style="left:${2 + k*25}%;--dur:${dur + (k%2)*0.8}s;animation-delay:${(k*0.25).toFixed(2)}s;${o.length > 14 ? 'font-size:.82rem;' : ''}">${T(o)}</button>`).join('')}</div>`;
      balloonT0 = performance.now();
      let escaped = 0;
      $$('.balloon').forEach(b => { b.onanimationend = ev => { if(ev.animationName === 'rise'){ escaped++; if(escaped === opts.length && !lock) answer(null, it) } }; b.onclick = () => { if(lock) return; b.classList.add('popped'); answer(b.dataset.o, it, 1 - Math.min(1, (performance.now() - balloonT0) / (dur*1000))) } });
    } else {
      $('#play').innerHTML = `<div class="qcard"><div class="qmeta">${meta}</div><div class="qtext ${it.long ? 'long' : ''}">${T(it.q)}</div>
        <div class="opts">${opts.map((o,k) => `<button class="opt o${k} ${o.length > 22 ? 'long' : ''}" type="button" data-o="${esc(o)}"><span class="sh">${SHAPES[k]}</span>${T(o)}</button>`).join('')}</div><div id="fb"></div></div>`;
      $$('.opt').forEach(b => b.onclick = () => answer(b.dataset.o, it));
    }
  }
  async function answer(choice, it, frac = 0){
    if(lock || current.key !== myKey) return; lock = true;
    const ok = choice === it.a, now = Store.now();
    beep(ok);
    const up = pacedUpdate(SS.sess, local, ok, now, frac); Object.assign(local, up);
    Store.update(sp(SS.code, 'players/' + SS.pid), up);
    if(g === 'balloon'){
      $$('.balloon').forEach(b => { b.disabled = true; if(b.dataset.o === it.a) b.style.outline = '4px solid var(--ok)' });
      const fb = document.createElement('div'); fb.className = 'feedback ' + (ok ? 'ok' : 'bad'); fb.textContent = ok ? 'أحسنت! فرقعت البالون الصحيح' : (choice === null ? 'طارت البالونات! الإجابة: ' : 'ليست هذه. الإجابة: ') + (ok ? '' : ar(it.a));
      $('#play').appendChild(fb);
      setTimeout(next, ok ? 900 : 2000);
    } else {
      $$('.opt').forEach(b => { b.disabled = true; if(b.dataset.o === it.a) b.classList.add('right'); else if(b.dataset.o === choice) b.classList.add('dim') });
      $('#fb').innerHTML = ok ? `<div class="feedback ok">${g === 'tug' ? 'شدّة قوية! أحسنت' : 'صحيح! تقدّمت سيارتك'}</div>` : `<div class="feedback bad">الإجابة الصحيحة: ${T(it.a)} • انتظر ثانيتين</div>`;
      if(!ok) $('.qcard').classList.add('shake');
      setTimeout(next, ok ? 650 : 2200);
    }
    drawMini(SS.sess);
  }
  drawMini(s); next();
}
/* المطابقة */
function sMatch(s){
  const L = lessonById(s.info.lesson), local = { ...SS.me };
  const myKey = 's:' + s.info.status + ':' + s.info.round + ':match';
  mount(myKey, `${sTop(s)}<div class="row" style="margin-bottom:10px"><span class="pill" id="mStat"></span><span class="muted">اضغط على مسألة ثم على ناتجها.</span></div><div id="play"></div>`, () => { const sc = $('#myScore'); if(sc) sc.textContent = ar(local.score||0) + ' نقطة' });
  function round(){
    if(current.key !== myKey) return;
    const total = bookCount(L, true);
    if(local.done){ $('#play').innerHTML = `<div class="card wait"><span class="big-av">🧩</span><h2>طابقت جميع المسائل!</h2><p class="muted" style="margin:0">نقاطك: ${ar(local.score||0)} • انتظر حتى ينهي المعلم اللعبة.</p></div>`; return }
    const extra = SS.sess.info.set.extra, start = local.idx || 0, pairs = [], seen = new Set();
    let used = 0;
    while(pairs.length < 4 && used < 16){
      if(!extra && start + used >= total) break;
      const it = seqItem(L, extra, SS.pid + 'm', start + used, true); used++;
      const mc = matchCard(it) || { left: it.q, right: it.a };
      if(seen.has(mc.right)) continue; seen.add(mc.right); pairs.push(mc);
    }
    if(!pairs.length){ local.done = true; Store.update(sp(SS.code, 'players/' + SS.pid), { done:true }); return round() }
    const r = rng(SS.pid + ':r' + start), left = shuf(pairs.map((p,i) => ({ i, t:p.left })), r), right = shuf(pairs.map((p,i) => ({ i, t:p.right })), r);
    $('#mStat').textContent = SS.sess.info.set.extra ? 'جولة ' + ar(Math.floor(start/4) + 1) : `${ar(Math.min(start, total))} من ${ar(total)}`;
    $('#play').innerHTML = `<div class="match"><div class="mcol">${left.map(c => `<button class="mcard" type="button" data-side="l" data-i="${c.i}">${T(c.t)}</button>`).join('')}</div>
      <div class="mcol">${right.map(c => `<button class="mcard ans" type="button" data-side="r" data-i="${c.i}">${T(c.t)}</button>`).join('')}</div></div>`;
    let selL = null, selR = null, matched = 0, mistakes = 0;
    $$('.mcard').forEach(b => b.onclick = () => {
      if(b.dataset.side === 'l'){ selL && selL.classList.remove('sel'); selL = b } else { selR && selR.classList.remove('sel'); selR = b }
      b.classList.add('sel');
      if(selL && selR){
        const a = selL, c = selR; selL = selR = null;
        if(a.dataset.i === c.dataset.i){ beep(true); a.classList.add('gone'); c.classList.add('gone'); matched++; local.score = (local.score||0) + 100; local.ok = (local.ok||0) + 1;
          if(matched === pairs.length){ local.idx = start + used; if(!SS.sess.info.set.extra && local.idx >= total) local.done = true;
            Store.update(sp(SS.code, 'players/' + SS.pid), { idx: local.idx, score: local.score, ok: local.ok, bad: local.bad || 0, done: local.done || null, t: Store.now() });
            setTimeout(round, 500) }
          else Store.update(sp(SS.code, 'players/' + SS.pid), { score: local.score, ok: local.ok });
        } else { beep(false); mistakes++; local.score = Math.max(0, (local.score||0) - 20); local.bad = (local.bad||0) + 1; [a,c].forEach(x => { x.classList.remove('sel'); x.classList.add('wrong','shake'); setTimeout(() => x.classList.remove('wrong','shake'), 450) }); Store.update(sp(SS.code, 'players/' + SS.pid), { score: local.score, bad: local.bad }) }
        const sc = $('#myScore'); if(sc) sc.textContent = ar(local.score||0) + ' نقطة';
      }
    });
  }
  round();
}
/* مسابقة المعلم - جهاز الطالب */
function sQuiz(s){
  mount('s:' + s.info.status + ':' + s.info.round + ':quiz', `${sTop(s)}<div id="play"></div>`, s2 => draw(s2));
  let lastKey = null;
  function draw(s2){
    const q = s2.info.q, items = quizItems(s2), it = items[q.i], opts = optionsFor(it, s2.info.code + 'q' + q.i);
    const mine = s2.answers && s2.answers[q.i] && s2.answers[q.i][SS.pid];
    const sc = $('#myScore'); if(sc) sc.textContent = ar(SS.me.score || 0) + ' نقطة';
    const key = q.i + ':' + q.reveal + ':' + (mine ? 1 : 0) + ':' + (Store.now() < q.at ? 'w' : 'g');
    if(key === lastKey) return; lastKey = key;
    const head = `<div class="qmeta">السؤال ${ar(q.i+1)} من ${ar(items.length)}</div><div class="qtext ${it.long ? 'long' : ''}">${T(it.q)}</div>`;
    if(q.reveal){
      const ok = mine && mine.ok;
      $('#play').innerHTML = `<div class="qcard">${head}<div class="feedback ${ok ? 'ok' : 'bad'}">${mine ? (ok ? 'إجابة صحيحة!' : 'إجابة غير صحيحة') : 'انتهى الوقت'} • الإجابة: ${T(it.a)}</div>
        <p class="muted" style="text-align:center;margin:10px 0 0">مركزك الآن: ${ar(ranked(s2).findIndex(p => p.id === SS.pid) + 1)} من ${ar(plist(s2).length)}</p></div>`;
      if(ok) confetti();
    } else if(mine){
      $('#play').innerHTML = `<div class="card wait"><span class="big-av">⏳</span><h2>تم إرسال إجابتك</h2><p class="muted" style="margin:0">انتظر حتى تظهر الإجابة الصحيحة.</p></div>`;
    } else if(Store.now() < q.at){
      $('#play').innerHTML = `<div class="card wait"><span class="big-av">👀</span><h2>استعد للسؤال ${ar(q.i+1)}</h2></div>`;
      setTimeout(() => SS.sess && draw(SS.sess), Math.max(50, q.at - Store.now() + 30));
    } else {
      $('#play').innerHTML = `<div class="qcard">${head}<div class="opts">${opts.map((o,k) => `<button class="opt o${k} ${o.length > 22 ? 'long' : ''}" type="button" data-o="${esc(o)}"><span class="sh">${SHAPES[k]}</span>${T(o)}</button>`).join('')}</div></div>`;
      $$('.opt').forEach(b => b.onclick = async () => {
        $$('.opt').forEach(x => x.disabled = true);
        const ms = Store.now() - q.at, ok = b.dataset.o === it.a, pts = ok ? quizPoints(ms, s2) : 0; beep(ok);
        const me = SS.sess.players[SS.pid] || {};
        await Store.update(sp(SS.code), { [`answers/${q.i}/${SS.pid}`]: { c: b.dataset.o, ok, ms }, [`players/${SS.pid}/score`]: (me.score||0) + pts, [`players/${SS.pid}/ok`]: (me.ok||0) + (ok ? 1 : 0) });
      });
    }
  }
  draw(s);
}
/* عجلة الأسماء - جهاز الطالب */
function sWheel(s){
  mount('s:' + s.info.status + ':' + s.info.round + ':wheel', `${sTop(s)}<div id="play"></div>`, s2 => draw(s2));
  let lastKey = null;
  function draw(s2){
    const w = s2.info.wheel || {}, sc = $('#myScore'); if(sc) sc.textContent = ar(SS.me.score || 0) + ' نقطة';
    const key = (w.n||0) + ':' + w.state; if(key === lastKey) return; lastKey = key;
    const p = w.pid && s2.players ? s2.players[w.pid] : null, mineTurn = w.pid === SS.pid;
    if(!w.state || w.state === 'idle'){ $('#play').innerHTML = `<div class="card wait"><span class="big-av">🎡</span><h2>شاهد شاشة المعلم</h2><p class="muted" style="margin:0">ستدور العجلة وتختار طالباً للإجابة.</p></div>`; return }
    if(w.state === 'spin'){ $('#play').innerHTML = `<div class="card wait"><span class="big-av">🎡</span><h2 class="dots">العجلة تدور</h2></div>`; return }
    const it = wheelItem(s2, w.i), opts = optionsFor(it, s2.info.code + 'w' + w.i);
    const head = `<div class="qmeta">${mineTurn ? 'دورك الآن! أجب عن السؤال' : 'الدور على ' + esc(p ? p.name : '') + ' • فكّر في الإجابة معه'}</div><div class="qtext ${it.long ? 'long' : ''}">${T(it.q)}</div>`;
    if(w.state === 'ask' && mineTurn){
      $('#play').innerHTML = `<div class="qcard">${head}<div class="opts">${opts.map((o,k) => `<button class="opt o${k} ${o.length > 22 ? 'long' : ''}" type="button" data-o="${esc(o)}"><span class="sh">${SHAPES[k]}</span>${T(o)}</button>`).join('')}</div></div>`;
      $$('.opt').forEach(b => b.onclick = () => { $$('.opt').forEach(x => x.disabled = true); const ok = b.dataset.o === it.a; beep(ok); const me = SS.sess.players[SS.pid] || {};
        const u = { 'info/wheel/state':'done', 'info/wheel/ok': ok, 'info/wheel/c': b.dataset.o };
        if(ok){ u[`players/${SS.pid}/score`] = (me.score||0) + 100; u[`players/${SS.pid}/ok`] = (me.ok||0) + 1 } else u[`players/${SS.pid}/bad`] = (me.bad||0) + 1;
        Store.update(sp(SS.code), u) });
    } else if(w.state === 'ask'){
      $('#play').innerHTML = `<div class="qcard">${head}<p class="muted dots" style="margin:10px 0 0">ننتظر إجابة ${esc(p ? p.name : '')}</p></div>`;
    } else {
      $('#play').innerHTML = `<div class="qcard">${head}<div class="feedback ${w.ok ? 'ok' : 'bad'}">${w.ok ? 'إجابة صحيحة! +١٠٠' : 'إجابة غير صحيحة'} • الإجابة: ${T(it.a)}</div></div>`;
      if(w.ok && mineTurn) confetti();
    }
  }
  draw(s);
}
function sEnd(s){
  const g = s.info.game, rk = ranked(s), pos = rk.findIndex(p => p.id === SS.pid) + 1, me = SS.me;
  let msg;
  if(g === 'tug'){ const r = s.info.result || {}; msg = r.team === -1 ? 'تعادل الفريقان! أداء رائع من الجميع.' : ((me.team ? 1 : 0) === r.team ? `فاز فريقك ${TEAMS[r.team].name}! 🎉` : `فاز ${TEAMS[r.team || 0].name}. حاول مرة أخرى!`) }
  else msg = pos === 1 ? 'أنت البطل! المركز الأول 🏆' : pos <= 3 ? `رائع! المركز ${ar(pos)}` : `مركزك ${ar(pos)} من ${ar(rk.length)}. أحسنت المحاولة!`;
  mount('s:' + s.info.status + ':' + s.info.round + ':' + g, `<section class="card wait"><span class="big-av">${me.av||'🙂'}</span><h2>${msg}</h2>
    <p style="margin:0">نقاطك: <b>${ar(me.score||0)}</b> • إجابات صحيحة: <b>${ar(me.ok||0)}</b></p>
    <p class="muted" style="margin:0">ابقَ على الصفحة، قد يبدأ المعلم جولة جديدة.</p></section>
    <div class="sec-title"><h3>الترتيب</h3></div>${lbHTML(s, 10)}`, () => {});
  const won = g === 'tug' ? (s.info.result && (me.team ? 1 : 0) === s.info.result.team) : pos <= 3;
  if(won) confetti();
}

/* =========================================================
   مؤقّتات عامة
   ========================================================= */
setInterval(() => {
  if(!Store) return;
  const now = Store.now();
  $$('[data-endat]').forEach(el => { const end = +el.dataset.endat; if(!end) return; const left = end - now; el.textContent = mmss(left); el.classList.toggle('low', left < 30000) });
  if(isTeacher() && TS.code) teacherTick();
}, 500);
setInterval(() => { if(TS.code) quizTimerTick() }, 200);

(async function boot(){
  app.innerHTML = '<div class="card wait"><span class="big-av">÷</span><p class="muted dots">جارٍ التحميل</p></div>';
  await initStore();
  const code = joinCodeFromUrl();
  if(code){
    const pid = lsGet('rc_pid_' + code);
    if(pid && await Store.get(sp(code, 'players/' + pid))) return watchAsStudent(code, pid);
    return showJoin(code);
  }
  if(isTeacher()){ const c = lsGet('rc_t_code'); if(c && await Store.get(sp(c, 'info'))) return watchSession(c); return showDash() }
  showHome();
})();
</script>
